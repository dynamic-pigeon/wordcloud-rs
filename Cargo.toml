[package]
name = "wordcloud"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A random or reproducible word-cloud image generator for Rust"
license = "MIT AND OFL-1.1"
readme = "README.md"
keywords = ["wordcloud", "visualization", "text", "image"]
categories = ["multimedia::images", "visualization"]
exclude = ["/wordcloud.png", "/wordcloud-zh.png"]

[lib]
name = "wordcloud"
path = "src/lib.rs"

[dependencies]
# `std` would enable owned_ttf_parser's default tables (variable fonts, GSUB/GPOS,
# AAT, glyph names). This crate only rasterizes outlines, so keep the parser slim.
ab_glyph = { version = "0.2.32", default-features = false, features = ["libm"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
unicode-segmentation = { version = "1.13.3", default-features = false }

[dev-dependencies]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "chinese"
path = "examples/chinese.rs"

[[bench]]
name = "comparison"
path = "benches/comparison.rs"
harness = false
